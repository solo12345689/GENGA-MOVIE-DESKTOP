<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genga Movie</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a12;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-app-region: drag;
        }

        .bg-glow {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, transparent 70%);
            animation: pulse-glow 3s ease-in-out infinite;
            pointer-events: none;
        }
        .bg-glow-2 {
            position: fixed;
            top: 30%; left: 60%;
            transform: translate(-50%, -50%);
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168,85,247,0.12) 0%, transparent 70%);
            animation: pulse-glow 4s ease-in-out infinite reverse;
            pointer-events: none;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        .particles {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: float-up linear infinite;
        }
        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-20px) scale(1); opacity: 0; }
        }

        .logo-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            animation: fade-in-up 0.6s ease forwards;
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            width: 100px; height: 100px;
            background: rgba(255,255,255,0.03);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            background-clip: padding-box;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .logo-icon img {
            width: 100%; height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(99,102,241,0.5));
        }

        .app-name {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-tagline {
            font-size: 1rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 1rem; /* Added spacing */
            font-weight: 500;
        }

        .status-container {
            position: relative;
            z-index: 10;
            margin-top: 5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            animation: fade-in-up 0.8s ease 0.3s both;
        }

        .progress-track {
            width: 320px;
            height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            animation: progress-anim 2.5s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(99,102,241,0.6);
        }
        @keyframes progress-anim {
            0%   { width: 0%;   margin-left: 0; }
            50%  { width: 70%;  margin-left: 0; }
            80%  { width: 30%;  margin-left: 70%; }
            100% { width: 0%;   margin-left: 100%; }
        }

        .dots {
            display: flex;
            gap: 0.5rem;
        }
        .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            animation: dot-bounce 1.4s ease-in-out infinite;
        }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot-bounce {
            0%, 80%, 100% { transform: scale(1); background: rgba(255,255,255,0.2); }
            40% { transform: scale(1.4); background: #6366f1; }
        }

        .status-text {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 1px;
            margin-top: 0.5rem;
        }

        .version-badge {
            position: fixed;
            bottom: 2rem;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.15);
            z-index: 10;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>
    <div class="particles" id="particles"></div>

    <div class="logo-container">
        <div class="logo-icon">
            <img src="logo.png" alt="Genga Movie" />
        </div>
        <div>
            <div class="app-name">Genga Movie</div>
            <div class="app-tagline">YOUR UNIVERSE OF CONTENT</div>
        </div>
    </div>

    <div class="status-container">
        <div class="progress-track">
            <div class="progress-bar"></div>
        </div>
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="status-text" id="status-text">Starting backend engine...</div>
    </div>

    <div class="version-badge">v1.0.0 &nbsp;&nbsp;•&nbsp;&nbsp; EXCLUSIVE DESKTOP EDITION</div>

    <script>
        const container = document.getElementById('particles');
        const colors = ['#6366f1', '#a855f7', '#ec4899', '#3b82f6'];
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 4 + 2;
            p.style.cssText = `
                width: ${size}px;
                height: ${size}px;
                left: ${Math.random() * 100}%;
                background: ${colors[Math.floor(Math.random() * colors.length)]};
                animation-duration: ${Math.random() * 8 + 6}s;
                animation-delay: ${Math.random() * 5}s;
            `;
            container.appendChild(p);
        }

        const statusEl = document.getElementById('status-text');
        const messages = [
            'Initializing core engine...',
            'Connecting to database...',
            'Loading assets...',
            'Preparing interface...',
            'Almost there...'
        ];
        let msgIdx = 0;
        setInterval(() => {
            msgIdx = (msgIdx + 1) % messages.length;
            statusEl.textContent = messages[msgIdx];
        }, 1500);
    </script>
</body>
</html>
